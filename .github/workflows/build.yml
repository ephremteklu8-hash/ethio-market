name: Build Ethio Market APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: |
          rm -rf android
          flutter create \
            --platforms=android \
            --org com.ethiomarket \
            .

      - name: Set package name
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old = "com.ethiomarket.ethio_market"
          new = "com.ethiomarket.app"

          for path in Path("android").rglob("*"):
              if path.is_file():
                  try:
                      text = path.read_text()
                      if old in text:
                          path.write_text(text.replace(old, new))
                  except (UnicodeDecodeError, OSError):
                      pass
          PY

      - name: Add Firebase configuration
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: |
          if [ -z "$FIREBASE_CONFIG" ]; then
            echo "ERROR: FIREBASE_CONFIG secret is missing"
            exit 1
          fi

          printf '%s' "$FIREBASE_CONFIG" > android/app/google-services.json

      - name: Configure Google Services
        run: |
          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle.kts")
          app = Path("android/app/build.gradle.kts")

          settings_text = settings.read_text()
          app_text = app.read_text()

          # Add Google Services plugin to settings.gradle.kts
          if 'com.google.gms.google-services' not in settings_text:
              marker = 'id("org.jetbrains.kotlin.android")'

              settings_text = settings_text.replace(
                  marker,
                  marker + '\n    id("com.google.gms.google-services") version "4.4.3" apply false'
              )

          settings.write_text(settings_text)

          # Apply Google Services plugin to app
          if 'com.google.gms.google-services' not in app_text:
              marker = 'id("org.jetbrains.kotlin.android")'

              app_text = app_text.replace(
                  marker,
                  marker + '\n    id("com.google.gms.google-services")'
              )

          app.write_text(app_text)
          PY

      - name: Verify Firebase
        run: |
          python3 - <<'PY'
          import json

          file = "android/app/google-services.json"

          with open(file, "r") as f:
              config = json.load(f)

          package_name = (
              config["client"][0]
              ["client_info"]
              ["android_client_info"]
              ["package_name"]
          )

          print("Firebase package:", package_name)

          if package_name != "com.ethiomarket.app":
              raise SystemExit(
                  "ERROR: Firebase package must be com.ethiomarket.app"
              )

          print("Firebase configuration OK")
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ethio-market-apk
          path: build/app/outputs/flutter-apk/app-release.apk
