name: Build Ethio Market APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Remove old Android project
        run: rm -rf android

      - name: Create Flutter Android project
        run: flutter create --platforms=android .

      - name: Add Firebase configuration
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: |
          echo "$FIREBASE_CONFIG" > android/app/google-services.json

      - name: Enable Google Services plugin
        run: |
          sed -i '/id "org.jetbrains.kotlin.android"/a\    id "com.google.gms.google-services" version "4.4.3" apply false' android/settings.gradle
          sed -i '/dev.flutter.flutter-gradle-plugin/a\    id "com.google.gms.google-services"' android/app/build.gradle

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ethio-market-apk
          path: build/app/outputs/flutter-apk/app-release.apk
