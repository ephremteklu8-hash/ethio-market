name: Build Ethio Market APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: flutter create --platforms=android .
        - name: Set Android package name
  run: |
    sed -i 's/applicationId = "com.example.ethio_market"/applicationId = "com.ethiomarket.app"/' android/app/build.gradle.kts

      - name: Add Firebase configuration
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: |
          echo "$FIREBASE_CONFIG" > android/app/google-services.json

      - name: Configure Google Services
        run: |
          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle")
          app_gradle = Path("android/app/build.gradle")

          if settings.exists():
              text = settings.read_text()
              if "com.google.gms.google-services" not in text:
                  text = text.replace(
                      "plugins {",
                      'plugins {\n    id "com.google.gms.google-services" version "4.4.3" apply false'
                  )
                  settings.write_text(text)

          if app_gradle.exists():
              text = app_gradle.read_text()
              if "com.google.gms.google-services" not in text:
                  text = text.replace(
                      "plugins {",
                      'plugins {\n    id "com.google.gms.google-services"'
                  )
                  app_gradle.write_text(text)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ethio-market-apk
          path: build/app/outputs/flutter-apk/app-release.apk
