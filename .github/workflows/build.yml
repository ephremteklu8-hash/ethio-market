name: Build Ethio Market APK

on:
push:
branches:
- main
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout code
    uses: actions/checkout@v4

  - name: Set up Flutter
    uses: subosito/flutter-action@v2
    with:
      channel: stable

  - name: Generate Android project
    run: |
      rm -rf android
      flutter create --platforms=android .

  - name: Configure Android package
    run: |
      sed -i 's/applicationId = "com.example.ethio_market"/applicationId = "com.ethiomarket.app"/' android/app/build.gradle.kts
      sed -i 's/namespace = "com.example.ethio_market"/namespace = "com.ethiomarket.app"/' android/app/build.gradle.kts

  - name: Configure Firebase
    env:
      FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
    run: |
      printf '%s' "$FIREBASE_CONFIG" > android/app/google-services.json

  - name: Configure Google Services
    run: |
      python3 - <<'PY'
      from pathlib import Path

      settings = Path("android/settings.gradle.kts")
      text = settings.read_text()

      text = text.replace(
          'id("org.jetbrains.kotlin.android")',
          'id("org.jetbrains.kotlin.android") version "2.1.0"'
      )

      if 'id("com.google.gms.google-services") version' not in text:
          text = text.replace(
              'id("org.jetbrains.kotlin.android") version "2.1.0"',
              'id("org.jetbrains.kotlin.android") version "2.1.0"\n    id("com.google.gms.google-services") version "4.4.3" apply false'
          )

      settings.write_text(text)

      app = Path("android/app/build.gradle.kts")
      text = app.read_text()

      if 'id("com.google.gms.google-services")' not in text:
          text = text.replace(
              'id("org.jetbrains.kotlin.android")',
              'id("org.jetbrains.kotlin.android")\n    id("com.google.gms.google-services")'
          )

      app.write_text(text)
      PY

  - name: Get dependencies
    run: flutter pub get

  - name: Build APK
    run: flutter build apk --release

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: ethio-market-apk
      path: build/app/outputs/flutter-apk/app-release.apk
