name: Build Ethio Market APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create clean Android project
        run: |
          rm -rf /tmp/ethio_market_android
          flutter create \
            --project-name ethio_market \
            --org com.ethiomarket \
            --platforms android \
            /tmp/ethio_market_android

          rm -rf android
          cp -R /tmp/ethio_market_android/android android

      - name: Set application ID
        run: |
          sed -i 's/com.ethiomarket.ethio_market/com.ethiomarket.app/g' android/app/build.gradle.kts
          sed -i 's/com.example.ethio_market/com.ethiomarket.app/g' android/app/build.gradle.kts

          find android/app/src -type f \( -name "*.kt" -o -name "*.java" -o -name "*.xml" \) \
            -exec sed -i 's/com.ethiomarket.ethio_market/com.ethiomarket.app/g' {} \;

      - name: Add Firebase configuration
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: |
          printf '%s' "$FIREBASE_CONFIG" > android/app/google-services.json

      - name: Configure Google Services
        run: |
          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle.kts")
          text = settings.read_text()

          if 'com.google.gms.google-services' not in text:
              marker = 'id("org.jetbrains.kotlin.android")'
              text = text.replace(
                  marker,
                  marker + '\n    id("com.google.gms.google-services") version "4.4.3" apply false'
              )

          settings.write_text(text)

          app = Path("android/app/build.gradle.kts")
          text = app.read_text()

          if 'com.google.gms.google-services' not in text:
              marker = 'id("org.jetbrains.kotlin.android")'
              text = text.replace(
                  marker,
                  marker + '\n    id("com.google.gms.google-services")'
              )

          app.write_text(text)
          PY

      - name: Verify Firebase package
        run: |
          python3 - <<'PY'
          import json

          with open("android/app/google-services.json") as f:
              data = json.load(f)

          package_name = data["client"][0]["client_info"]["android_client_info"]["package_name"]

          print("Firebase package:", package_name)

          if package_name != "com.ethiomarket.app":
              raise Exception(
                  "Firebase package must be com.ethiomarket.app"
              )
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ethio-market-apk
          path: build/app/outputs/flutter-apk/app-release.apk
